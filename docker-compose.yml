version: '3.7'

services:
  app:
    image: domhenrique/app-gridd:v1.1.1
    container_name: app-gridd
    restart: always
    networks:
      - portainer_hnperf
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.gridd-app.rule=Host(`app.griddmkt360.com.br`)"
      - "traefik.http.routers.gridd-app.entrypoints=websecure"
      - "traefik.http.routers.gridd-app.tls=true"
      - "traefik.http.routers.gridd-app.tls.certresolver=letsencryptresolver"
      - "traefik.http.services.app-gridd.loadbalancer.server.port=80"

  minio:
    image: quay.io/minio/minio
    container_name: minio-gridd
    restart: always
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=admin
      - MINIO_ROOT_PASSWORD=admin123
      - MINIO_API_CORS_ALLOW_ORIGIN=*
    ports:
      - "9000:9000"
    networks:
      - portainer_hnperf
    labels:
      - "traefik.enable=true"
      # MinIO API (S3)
      - "traefik.http.routers.gridd-minio.rule=Host(`minio.griddmkt360.com.br`)"
      - "traefik.http.routers.gridd-minio.entrypoints=websecure"
      - "traefik.http.routers.gridd-minio.tls=true"
      - "traefik.http.routers.gridd-minio.tls.certresolver=letsencryptresolver"
      - "traefik.http.routers.gridd-minio.service=minio"
      - "traefik.http.services.minio.loadbalancer.server.port=9000"
      # MinIO Console (Web UI)
      - "traefik.http.routers.gridd-minio-console.rule=Host(`console.griddmkt360.com.br`)"
      - "traefik.http.routers.gridd-minio-console.entrypoints=websecure"
      - "traefik.http.routers.gridd-minio-console.tls=true"
      - "traefik.http.routers.gridd-minio-console.tls.certresolver=letsencryptresolver"
      - "traefik.http.routers.gridd-minio-console.service=minio-console"
      - "traefik.http.services.minio-console.loadbalancer.server.port=9001"

  setup:
    image: domhenrique/app-gridd:builder
    container_name: app-setup
    command: node scripts/setup-all.js
    environment:
      - DATABASE_URL=postgresql://postgres:CjieaOY7UD6pszsv@db.lyewjlfgojgvywnkojsf.supabase.co:5432/postgres
      - MINIO_ENDPOINT=http://127.0.0.1:9000
      - MINIO_ACCESS_KEY=admin
      - MINIO_SECRET_KEY=admin123
      - MINIO_BUCKET_NAME=agency-assets
      - NODE_OPTIONS=--dns-result-order=ipv4first
    depends_on:
      - minio
    network_mode: "host"

volumes:
  minio-data:

networks:
  portainer_hnperf:
    external: true
